# Manifest for compute_attenuation_analysis.py (Phase 0 gate run), mirroring
# retention_manifest.yaml's structure but keyed by topology-size band instead of churn
# condition, since RQ2/RQ3's scale question is regressed against n_discovered within band,
# not compared across a seeds dict the way the retention scripts are.
#
# PROVISIONAL: all three bands share the confounded cross-band join_donor_pool_20_topologies
# donor pool (431 vs 192 novel donor/topology pairs across bands -- see dissertation_log_v2.md).
# These numbers are a directional gate read only, not thesis-ready, until same-band donor pools
# (a separate, not-yet-started follow-up) are used to retrain and re-evaluate.

target_relevant_events_per_change_type: 200
max_episodes_per_band: 400          # sane episode budget cap -- report shortfall rather than hang
switch_interval_episodes: 5         # topologies within a band are cycled every N episodes
n_topologies_per_band: 8            # sampled from each band's own topology pool (not all 100 -- runtime)

bands:
  10-15:
    run_folder: "logs/[useless but backup] compressed_scale_10_15_2026-07-18_05-25-49/PPO_x_control_SecureBERT"
    topology_source_folder: scalability_10_15   # under cyberbattle/data/env_samples/
    checkpoint_glob: checkpoints/1/checkpoint_*_steps.zip
  30-40:
    run_folder: "logs/[useless but backup] compressed_scale_30_40_2026-07-18_05-25-49/PPO_x_control_SecureBERT"
    topology_source_folder: scalability_30_40
    checkpoint_glob: checkpoints/1/checkpoint_*_steps.zip
  80-100:
    run_folder: "logs/[useless but backup] compressed_scale_80_100_2026-07-18_05-25-49/PPO_x_control_SecureBERT"
    topology_source_folder: scalability_80_100
    checkpoint_glob: checkpoints/1/checkpoint_*_steps.zip
