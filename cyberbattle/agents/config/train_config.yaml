# Configuration file related to the script train_agent.py, sample_agent.py, hyperopt_agent.py

episode_iterations: 300 # cut-off considered regardless of K
proportional_cutoff_coefficient: 25 # whether to use a cut-off proportional to the number of nodes (K) and of how much, or -1 if not
winning_reward: 4000 # winning reward to add if the attacker goal is reached
train_iterations:   2000000 # number of training iterations
switch_interval: 50 # across the training set, in episodes
absolute_reward: False # whether to have a reward = max(0, reward) of the original one
losing_reward: -300 # losing reward to add if the attacker has lost
random_starter_node: True # whether the starter node should be changed periodically and randomly during training
stop_at_goal_reached: True # stop episode when goal is reached or not ?
norm_obs: True # whether to normalize observations
norm_reward: True # whether to normalize the reward
nlp_extractor: bert # LLM to consider ("distilbert", "bert", "roberta", "gpt", ....) useful only for train file but not for the sample or hyperopt files
distance_metric: cosine # distance metric to use in the action space to find the nearest neighbor
interest_node_value: 200 # value of the node of interest
switch_interest_node_interval: 10 # whether the node of interest should be switched periodically during training, or -1
isolation_filter_threshold: 0.1 # whether some starter nodes should be avoided if they do not respect some conditions (do not reach this percentage of nodes)
outcome_dimensions: 9
discrete_features:
  - "owned_nodes"
  - "discovered_nodes"
graph_embeddings_aggregations: # aggregation functions for the node embeddings to form the graph embedding
  - 'mean'
  - 'max'
  - 'min'
checkpoints_save_freq: 5000 # frequency of checkpoints saving during training

sample_subset_samples: 100 # number of samples to sample per outcome if just a subset is considered
remove_main_obstacles: True # whether to remove the main obstacles (e.g. DOS starter node)
remove_all_obstacles: True # whether to remove all obstacles (e.g. DOS actions for control game)
default_vulnerability_embeddings_size: 768

# Dynamic environment (node population changes)
dynamic_mode: leave # none | leave | join | both -- join is a scaffolded no-op for now
change_interval: 20 # calibration anchor: 1/change_interval is the expected steady-state removal probability per step at full ramp
dynamic_min_alive_nodes: 5 # absolute floor: dynamic leave never drops alive node count below this
dynamic_min_alive_fraction: 0.5 # relative floor: fraction of the original topology size, combined with the absolute floor via max()
dynamic_batch_interval: 150 # mean steps between low-rate Poisson "batch outage" events
dynamic_batch_size_mean: 1.0 # mean of the Poisson term added to the guaranteed 1 when a batch event fires
dynamic_batch_max_fraction: 0.3 # cap on batch size as a fraction of the current eligible pool
dynamic_degree_weighting: True # weight per-node removal probability down for high-degree/critical nodes
patch_service_dynamic_enabled: False # legacy patch/service/mixed dynamic changes -- off by default, unrelated to node leave/join

# Defender
static_defender_eviction_goal: False # if True, defender will try to evict all the nodes owned from the network
# Minimum and maximum of every defender parameter forming a uniform distribution to be sampled from across topologies
random_event_probability_min: 0.005
random_event_probability_max: 0.01
detect_probability_min: 0.05
detect_probability_max: 0.05
scan_capacity_min: 3
scan_capacity_max: 3
scan_frequency_min: 3
scan_frequency_max: 3

# Holdout method parameters
validation_ratio: 0.25
test_ratio: 0.2

# Validation set callback
val_switch_interval: 2 # in episodes, how frequently to switch the validation graphs in the set
val_freq: 15000 # frequency of validation
n_val_episodes: 20 # how many episodes to run overall every val_freq
