# Copy of test_config.yaml with dynamic_mode set to "both", matching the training condition
# (train_config.yaml's dynamic_mode: both) instead of the default's narrower "leave", and
# proportional_cutoff_coefficient raised from the default's 2 to 25 to match train_config.yaml --
# the default value cut test episodes off at ~2x node count steps, over 12x shorter than the ~25x
# node count budget the model was actually trained to operate within, crushing measured performance
# for reasons having nothing to do with policy quality. Use this file for any H1/H2 evaluation so
# the test-time episode budget and dynamic regime are both consistent with what the model trained
# under, rather than confounding a train-vs-test performance gap with genuine condition mismatches.

proportional_cutoff_coefficient: 25  # Whether to use the K coefficient for the cutoff and which coefficient
num_episodes_per_checkpoint: 10 # Number of episodes to run during testing for every checkpoint
num_iterations: 1000 # Other cutoff general that is considered regardless of K (to be set higher than K * max number of nodes if do not want to stop the episodes
switch_interval: 5 # in episodes across the testing topologies
isolation_filter_threshold: 0.01
default_vulnerability_embeddings_size: 768

# Dynamic environment: override the trained model's dynamic_mode at test time (e.g. trained static / tested dynamic)
dynamic_mode: both # none | leave | join | both

# Static defender if integrated
static_defender_eviction_goal: True # if True, defender will try to evict all the nodes owned from the network
random_event_probability: 0.01 # RandomEventsDefender
detect_probability: 0.01 # ScanAndReimageDefender
scan_capacity: 3
scan_frequency: 3
