# RQ3D checkpoint/topology manifest -- committed alongside rq3d_rollout.py (standing rule,
# 2026-08-04: "commit manifests and configs, not just scripts" -- see standing_rules.md).
#
# This is a clean copy of the recipe rq3d_rollout.py actually uses, combining two pieces that
# were NOT both durably committed before this task:
#   - checkpoint run folders: mirrors cyberbattle/agents/attenuation_manifest.yaml (already
#     tracked in git) -- included here again so this task is self-contained and doesn't depend
#     on cross-referencing a second file to know what it ran.
#   - the 8 topology IDs per band: copied from attenuation_gate_archive/2026-07-26_trpo_5seed_gate/
#     grid_topology_id_map.json, which is NOT tracked (the entire attenuation_gate_archive/
#     directory is untracked -- `git status` confirms `?? attenuation_gate_archive/`). That file
#     could be lost the same way the original CX pipeline's manifest was. This copy closes that
#     gap for the specific data this task depends on.
#
# POPULATION IDENTITY (verified, not assumed -- see rq3d_rollout.py's own header and the RQ3D
# task's Addendum 5): this is the standard 5-seed x 3-band checkpoint grid, DYNAMICALLY trained
# (dynamic_mode='both' during training -- confirmed via app.log DynamicEnv events firing from
# step 2 of training, NOT a static-trained population). This IS Task CX PART 3's own "adapted
# gate checkpoints" (evidence_taskCX.md:272 names them "the... 'adapted' GATE checkpoints";
# evidence_taskF1.md:14's "gate grid slot 3" matches this file's 30-40 topology "3": "44" entry
# byte-for-byte; the archive folder is literally named "2026-07-26_trpo_5seed_gate"). Same
# population RQ2(c) used (evidence_taskRQ2C.md: "same checkpoints/seeds/bands and the same
# standard attenuation config").

